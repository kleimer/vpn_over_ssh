# SSHTUN-профиль сервера: образец. Создавать профили удобнее командой:
#   sshtun server add NAME HOST [--port N] [--user U] [--key FILE]
#       [--tun-start N] [--tun-end N] [--mtu N] [-- комментарий]
# Команда сама положит файл в ~/sshtun/servers/NAME.conf.
#
# Файл данных — в git не коммитится и не должен содержать реальных адресов
# в публичных копиях репозитория (плейсхолдеры — как ниже).
# Применить профиль: sshtun server use NAME
# comment: пример сервера (строка видна в 'sshtun server list')
SERVER_HOST=your-server.example.com
SERVER_PORT=65523
SSH_USER=sshvpn
KEY_FILE=/home/user/.ssh/sshtun_ed25519
TUN_START=200
TUN_END=300
MTU=1400
